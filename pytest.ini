[pytest]
testpaths =
    tp01-prompt/tests
    tp02-rag/tests
    tp03-langchain/tests
    tp04-lora-raft/tests
    tp05-mise-en-service/tests
    tp06-graphe/tests
pythonpath =
    .
    tp05-mise-en-service
addopts = -q -m "not modele" --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*allowed_objects.*
markers =
    code: exige qu'un exercice CODE soit fait ; rouge tant qu'il ne l'est pas
    bonus: exercice bonus, hors noyau ; ignore par defaut, active par --bonus
    modele: appelle un vrai moteur (Ollama, API) ; ignore par defaut, active par --modele
